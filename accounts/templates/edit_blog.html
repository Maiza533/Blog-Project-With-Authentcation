<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f6fa;">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4">Edit Blog</h2>


                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" name="title" value="{{ blog.title }}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea id="content" name="content" class="form-control" rows="6" required>{{ blog.content }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" name="status" class="form-select" required>
                                <option value="draft" {% if blog.status == "draft" %}selected{% endif %}>Draft</option>
                                <option value="published" {% if blog.status == "published" %}selected{% endif %}>Published</option>
                            </select>
                        </div>

                        <div class="mb-3">                            
                            <label for="image" class="form-label">Image</label>
                            {% if blog.image %}
                            <a href="{{ blog.image.url }}" target="_blank">{{blog.image.url}}</a>
                            {% endif %}
                            <input type="file" id="image" name="image" class="form-control">
                        </div>

                        <button type="submit" class="btn btn-primary">Update Blog</button>
                        <a href="{% url 'blog_detail' blog.slug %}" class="btn btn-secondary ms-2">Cancel</a>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
