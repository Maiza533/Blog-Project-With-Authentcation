<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.css" rel="stylesheet"/>
</head>
<body>
<section class="bg-body-tertiary vh-100">
<div class="container py-5 h-100">
<div class="row">


<div class="col-md-4">
    <div class="card text-center" style="border-radius:15px;">
        <div class="card-body">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="rounded-circle mb-3" width="100">
            <h4>{{ user.full_name }}</h4>
            <p class="text-muted">{{ user.email }}</p>
            <hr>
            <p><strong>Total Blogs:</strong> {{ blogs|length }}</p>
            <p><strong>Status:</strong> Active User</p>
        </div>
    </div>
</div>


<div class="col-md-8">
    <h3 class="text-black mb-4">My Blogs</h3>
    {% if blogs %}
    {% for blog in blogs %}
    <div class="card mb-4" style="border-radius:15px;">
            <div class="card-body">
                
                <h4 class="mb-2"><a href="{% url 'blog_detail' blog.slug %}" style="text-decoration:none;color:black;">{{ blog.title }}</a></h4>
                <p class="text-muted mb-2">Status: <strong>{{ blog.status }}</strong></p>
                <hr>
                <div class="d-flex justify-content-between">
                    <p class="small mb-0">
                        <i class="far fa-calendar"></i>{{ blog.created_at }}</p>
                        <a href="{% url 'blog_detail' blog.slug %}" class="btn btn-sm btn-primary">View</a>
                    </div>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <div class="card text-center" style="border-radius:15px;">
                <div class="card-body">
                    <h5>No blogs created yet</h5>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
<div class="mb-4">
        <a href="{% url 'blog_list' %}" class="btn btn-secondary">&larr; Back to Blog List</a>
    </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.2.0/mdb.min.js"></script>

</body>
</html>
