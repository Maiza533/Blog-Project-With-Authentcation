<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        justify-content: center;
        align-items: center;
        display: flex;
        background: linear-gradient(135deg, #71b7e6, #9b59b6);
      }
      .login {
        background: rgba(255, 255, 255, 0.8);
        padding: 35px;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      form {
        max-width: 300px;
        margin: auto;
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 5px 0 15px 0;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
      button {
        background-color: #4caf50;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        width: 100%;
        border-radius: 10px;
      }
      button:hover {
        background-color: #45a049;
      }
      a:hover {
        color: #4556a0;
      }
    </style>
  </head>
  <body>
    <div class="login">
      <h2>Login</h2>
      <form method="post">
        {% csrf_token %}
        <label>Email:</label><br />
        <input
          type="email"
          name="email"
          placeholder="Email"
          required
        /><br /><br />
        <label>Password:</label><br />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        /><br /><br />
        <button type="submit">Login</button>
      </form>

      {% if error %}
      <p style="color: red">{{ error }}</p>
      {% endif %}

      <p>
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
      </p>
    </div>
  </body>
</html>
